[project]
name = "wsl-master"
version = "0.1.3"
description = "WSL2 磁盘空间分析与清理工具：交互式树图磁盘分析、四类垃圾清理、VHDX 收缩助手"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wsl-master = "wsl_master.__main__:main"

[tool.setuptools.packages.find]
include = ["wsl_master*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]