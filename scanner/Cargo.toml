[package]
name = "wsl-scanner"
version = "0.1.2"
edition = "2021"

[dependencies]
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
shellexpand = "3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[profile.release]
lto = true
